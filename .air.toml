root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/payment-sandbox ./cmd/payment-sandbox"
  bin = "./tmp/payment-sandbox"
  delay = 500
  exclude_dir = [".git", "bin", "dist", "tmp"]
  include_ext = ["go", "env", "sql"]
  kill_delay = "500ms"
  send_interrupt = true
  stop_on_error = true

[log]
  time = true

[screen]
  clear_on_rebuild = true
