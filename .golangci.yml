version: "2"

run:
  timeout: 5m

linters:
  default: none

  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - nilerr
    - noctx
    - unconvert

  exclusions:
    generated: lax

formatters:
  enable:
    - gofmt
    - goimports