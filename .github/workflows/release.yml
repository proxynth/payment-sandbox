name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Propose and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Create or update release pull request
        if: ${{ github.ref == 'refs/heads/main' }}
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Create release tag after merging release pull request
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          release_pr=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state merged \
            --base main \
            --limit 100 \
            --json mergeCommit,title \
            --jq '.[] | select(.mergeCommit.oid == env.RELEASE_SHA and (.title | startswith("chore: :bookmark: release "))) | .title' | head -n 1)

          if [[ -z "$release_pr" ]]; then
            echo "No merged release pull request found for $RELEASE_SHA."
            exit 0
          fi

          version=$(jq -r '."."' .release-please-manifest.json)
          tag="v${version}"

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "Release tag ${tag} already exists."
            exit 0
          fi

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${tag}" \
            -f "sha=${RELEASE_SHA}"

          echo "Created release tag ${tag} for ${RELEASE_SHA}."

      - name: Checkout tagged commit
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Go
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-only: true

      - name: Validate release commit
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: make check

      - name: Run race-enabled tests
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: make test-race

      - name: Build and publish release artifacts
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
