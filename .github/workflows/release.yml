name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Propose and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main for release metadata
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          ref: main
          fetch-depth: 1

      - name: Create or update release pull request
        if: ${{ github.ref == 'refs/heads/main' }}
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Resolve release commit and metadata
        id: tag
        if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail

          release_sha=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state merged \
            --base main \
            --limit 100 \
            --json mergeCommit,title,mergedAt \
            --jq 'sort_by(.mergedAt) | map(select(.title | startswith("chore: :bookmark: release "))) | last | .mergeCommit.oid // empty')

          if [[ -z "$release_sha" ]]; then
            echo "No merged release pull request is waiting for publication."
            echo "release_pending=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=$(jq -r '."."' .release-please-manifest.json)
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "release_sha=${release_sha}" >> "$GITHUB_OUTPUT"

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            if gh release view "${tag}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              is_draft=$(gh release view "${tag}" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
              if [[ "$is_draft" == "true" ]]; then
                echo "Draft release ${tag} exists; continuing publication."
                echo "release_pending=true" >> "$GITHUB_OUTPUT"
              else
                echo "Release ${tag} is already published."
                echo "release_pending=false" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "Release tag ${tag} exists without a release; continuing publication."
              echo "release_pending=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          echo "Release ${tag} will be created after artifacts are built."
          echo "release_pending=true" >> "$GITHUB_OUTPUT"

      - name: Checkout release commit
        if: ${{ steps.tag.outputs.release_pending == 'true' }}
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          ref: ${{ steps.tag.outputs.release_sha }}
          fetch-depth: 0

      - name: Prepare local release tag
        if: ${{ steps.tag.outputs.release_pending == 'true' }}
        run: git tag "${{ steps.tag.outputs.tag }}" "${{ steps.tag.outputs.release_sha }}" 2>/dev/null || git tag --force "${{ steps.tag.outputs.tag }}" "${{ steps.tag.outputs.release_sha }}"

      - name: Set up Go
        if: ${{ steps.tag.outputs.release_pending == 'true' }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        if: ${{ steps.tag.outputs.release_pending == 'true' }}
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-only: true

      - name: Validate release commit
        if: ${{ steps.tag.outputs.release_pending == 'true' }}
        run: make check

      - name: Run race-enabled tests
        if: ${{ steps.tag.outputs.release_pending == 'true' }}
        run: make test-race

      - name: Build and publish release artifacts
        if: ${{ steps.tag.outputs.release_pending == 'true' }}
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --skip=publish

      - name: Publish release artifacts
        if: ${{ steps.tag.outputs.release_pending == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail

          tag="${{ steps.tag.outputs.tag || github.ref_name }}"
          mapfile -d '' assets < <(find dist -maxdepth 1 -type f -print0)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No release artifacts found in dist."
            exit 1
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false
          else
            gh release create "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "${{ steps.tag.outputs.release_sha }}" \
              --title "$tag" \
              --notes ""
          fi
