name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Propose and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main for release metadata
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Create or update release pull request
        if: ${{ github.ref == 'refs/heads/main' }}
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Create release tag after merging release pull request
        id: tag
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          release_sha=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state merged \
            --base main \
            --limit 100 \
            --json mergeCommit,title,mergedAt \
            --jq 'sort_by(.mergedAt) | map(select(.title | startswith("chore: :bookmark: release "))) | last | .mergeCommit.oid // empty')

          if [[ -z "$release_sha" ]]; then
            echo "No merged release pull request is waiting for a tag."
            echo "tag_created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=$(jq -r '."."' .release-please-manifest.json)
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            if gh release view "${tag}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release ${tag} is already published."
              echo "tag_created=false" >> "$GITHUB_OUTPUT"
            else
              echo "Release tag ${tag} exists without a published release; retrying publication."
              echo "tag_created=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${tag}" \
            -f "sha=${release_sha}"

          echo "Created release tag ${tag} for ${release_sha}."
          echo "tag_created=true" >> "$GITHUB_OUTPUT"

      - name: Checkout tagged commit
        if: ${{ startsWith(github.ref, 'refs/tags/v') || steps.tag.outputs.tag_created == 'true' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Set up Go
        if: ${{ startsWith(github.ref, 'refs/tags/v') || steps.tag.outputs.tag_created == 'true' }}
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        if: ${{ startsWith(github.ref, 'refs/tags/v') || steps.tag.outputs.tag_created == 'true' }}
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-only: true

      - name: Validate release commit
        if: ${{ startsWith(github.ref, 'refs/tags/v') || steps.tag.outputs.tag_created == 'true' }}
        run: make check

      - name: Run race-enabled tests
        if: ${{ startsWith(github.ref, 'refs/tags/v') || steps.tag.outputs.tag_created == 'true' }}
        run: make test-race

      - name: Build and publish release artifacts
        if: ${{ startsWith(github.ref, 'refs/tags/v') || steps.tag.outputs.tag_created == 'true' }}
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
