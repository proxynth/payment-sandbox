# yaml-language-server: $schema=https://raw.githubusercontent.com/goreleaser/goreleaser/v2.17.1/www/docs/static/schema.json
version: 2

project_name: payment-sandbox

before:
  hooks:
    - go mod tidy

builds:
  - id: payment-sandbox
    main: ./cmd/payment-sandbox
    binary: payment-sandbox
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X proxynth/payment-sandbox/internal/version.Version={{ .Version }}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - .env.example

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

release:
  mode: keep-existing
  replace_existing_artifacts: true

changelog:
  sort: asc
  filters:
    exclude:
      - '^Merge '
      - '^docs:'
